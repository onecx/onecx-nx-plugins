app:
  name: <%= applicationName %>
  image:
    repository: 'onecx-apps/<%= applicationName %>'
  routing:
    enabled: true
    path: /mfe/<%= propertyName %>/
  operator:
    # Microfrontend
    microfrontend:
      enabled: true
      specs:
        main:
          exposedModule: './<%= remoteModuleName %>'
          shareScope: angular_21       
          description: 'OneCX <%= className %> UI'
          note: 'OneCX <%= className %> UI module auto import via MF operator'
          type: MODULE
          technology: WEBCOMPONENTMODULE
          remoteName: <%= remoteName %>
          tagName: <%= tagName %>
    # Microservice
    microservice:
      spec:
        name: <%= applicationName %>
        description: OneCX <%= className %> Frontend
    # Permission
    permission:
      enabled: true
      spec:
        permissions:
        # ACTION P: Adjust permissions for the entity
